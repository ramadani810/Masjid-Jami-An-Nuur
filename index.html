<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    
    <!-- Title SEO (Optimasi Kata Kunci Pencarian) -->
    <title>Masjid Jami' An-Nuur Asrikaton Pakis Malang</title>
    
    <!-- Meta Description dengan Kata Kunci Spesifik -->
    <meta
      content="Website Resmi Masjid Jami' An-Nuur Desa Asrikaton, Kecamatan Pakis, Kabupaten Malang. Informasi jadwal sholat, kegiatan kajian, laporan donasi, dan pengumuman takmir."
      name="description"
    />
    <meta name="keywords" content="Masjid An-Nuur, Masjid Jami An Nuur, Asrikaton, Pakis Malang, Jadwal Sholat Asrikaton, Pengajian Asrikaton" />
    <meta name="author" content="Takmir Masjid Jami' An-Nuur Asrikaton" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Meta Sosial Media (Tampilan saat link di-share di WA/FB) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Masjid Jami' An-Nuur Asrikaton Pakis Malang" />
    <meta property="og:description" content="Website Resmi Masjid Jami' An-Nuur Asrikaton Pakis Malang - Informasi agenda ibadah, kajian rutin, dan laporan donasi." />
    <meta property="og:image" content="images/logo3.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Inter:wght@300;400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="images/logo3.png">
  </head>
  <body class="font-sans">
    <!-- Komponen dimuat otomatis oleh js/load-components.js -->
    <div id="component-navbar"></div>
    <main>
      <div id="component-home"></div>
      <div id="component-jadwal"></div>
      <div id="component-donasi"></div>
      <div id="component-agenda"></div>
      <div id="component-laporan"></div>
      <div id="component-lokasi"></div>
    </main>
    <div id="component-donation-modal"></div>

    <script src="js/load-components.js"></script>
  </body>
</html>
